name: Release

# Publishing is driven by tags. Nothing is published on a normal push to main.
#
#   npm version patch -m "%s" && git push --follow-tags   # -> publishes v0.1.x
#   npm version minor -m "%s" && git push --follow-tags   # -> publishes v0.x.0
#
# .github/workflows/auto-tag.yml does exactly that automatically for every push
# to main and then dispatches this workflow with the tag (GITHUB_TOKEN pushes
# cannot trigger workflows by themselves).
#
# `npm publish` triggers `prepublishOnly`, which runs scripts/build-publish.mjs,
# so the bundle in the tarball is always generated by CI and never committed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the full pipeline but publish with --dry-run'
        type: boolean
        default: true
      tag:
        description: 'Tag to release (used by auto-tag dispatches; empty on manual runs)'
        type: string
        default: ''

# id-token: write is what enables npm trusted publishing (OIDC) and the
# automatic provenance attestation. No NPM_TOKEN secret is used anywhere.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & smoke test the tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # npm trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
          node-version: '24'
          # Caching release installs has burned people before.
          package-manager-cache: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Bundle
        run: pnpm bundle

      - name: Unit tests
        run: pnpm test

      # Packs, installs into an empty project, and runs `volibearq install`
      # and `volibearq build` through npx. This is the step that would have
      # caught "could not determine executable to run".
      - name: Smoke test the published artifact
        run: pnpm smoke

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # If you scope the trusted publisher to a GitHub environment, create that
    # environment and uncomment — npm compares the environment name too.
    # environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tag being released
        id: ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            # Manual dispatch without a tag: release whatever HEAD is.
            tag="$(git describe --tags --abbrev=0)"
          fi
          git checkout "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Assert the tag matches package.json version
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tag="${RELEASE_TAG#v}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "releasing $(node -p "require('./package.json').name")@$version"

      - name: Assert the version is not already published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version already exists on the registry"
            exit 1
          fi

      # prepublishOnly generates dist/index.js + resources/pipelines.
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          else
            # --provenance is implicit with trusted publishing on a public repo;
            # drop it if you ever publish from a private repository.
            npm publish --provenance
          fi

      - name: Confirm the release is live
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5; do
            if npm view "$name@$version" version 2>/dev/null; then
              npm view "$name@$version" version bin dist.tarball
              exit 0
            fi
            echo "waiting for npm registry propagation (attempt $i/5)..."
            sleep 10
          done
          echo "::error::$name@$version not found on npm after 5 retries"
          exit 1
